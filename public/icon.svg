<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#4FA39B"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8D4D"/>
      <stop offset="100%" stop-color="#C9743F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Base -->
  <rect width="500" height="500" rx="90" fill="#060B0D"/>

  <!-- Outer Chip Package with Neon Border -->
  <rect x="50" y="50" width="400" height="400" rx="45" fill="#0C1518" stroke="url(#gradBorder)" stroke-width="10"/>

  <!-- Silicon Die -->
  <rect x="110" y="110" width="280" height="280" rx="25" fill="#122024" stroke="url(#gradGold)" stroke-width="12"/>

  <!-- PCB Copper Pins -->
  <g stroke="url(#gradGold)" stroke-width="14" stroke-linecap="round">
    <!-- Top Pins -->
    <line x1="170" y1="20" x2="170" y2="50"/>
    <line x1="250" y1="20" x2="250" y2="50"/>
    <line x1="330" y1="20" x2="330" y2="50"/>
    <!-- Bottom Pins -->
    <line x1="170" y1="450" x2="170" y2="480"/>
    <line x1="250" y1="450" x2="250" y2="480"/>
    <line x1="330" y1="450" x2="330" y2="480"/>
    <!-- Left Pins -->
    <line x1="20" y1="170" x2="50" y2="170"/>
    <line x1="20" y1="250" x2="50" y2="250"/>
    <line x1="20" y1="330" x2="50" y2="330"/>
    <!-- Right Pins -->
    <line x1="450" y1="170" x2="480" y2="170"/>
    <line x1="450" y1="250" x2="480" y2="250"/>
    <line x1="450" y1="330" x2="480" y2="330"/>
  </g>

  <!-- Code Logic '<' and '>' in Neon Cyan -->
  <g stroke="#00F5D4" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <polyline points="210,180 150,250 210,320"/>
    <polyline points="290,180 350,250 290,320"/>
  </g>

  <!-- Precision Solder Trace '/' in Copper Flame -->
  <line x1="280" y1="170" x2="220" y2="330" stroke="url(#gradGold)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Indicator Pulse Dot -->
  <circle cx="410" cy="90" r="10" fill="#00F5D4" filter="url(#glow)"/>
</svg>
